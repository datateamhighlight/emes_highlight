<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bangsuat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>HOÀN THÀNH CÔNG VIỆC</title>
</head>

<body>
    <div class="table-container">
        <table class="custom-table">
            <thead>
                <tr>
                    <th class="col-suat">TRUNG QUÂN | THÔNG TIN SUẤT CHƠI</th>
                    <th class="col-status">HOÀN THÀNH</th>
                    <th class="col-count">SỐ LƯỢNG HL (<span id="total-count">0</span>)</th>

                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Các dòng này sẽ được tạo tự động từ Java Script bên dưới -->
            </tbody>
        </table>
    </div>

    <div class="action-buttons">
        <button id="btn-save" onclick="saveData()">SAVE HIGHLIGHT</button>
    </div>

    <script>
        // Tạo 50 dòng tự động
        const tbody = document.getElementById('table-body');
        const totalRows = 50;
        const STORAGE_KEY = 'bang_suat_trung_quan';

        for (let i = 1; i <= totalRows; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <!-- Thêm contenteditable="true" để click vào là gõ được -->
                <td class="col-suat" contenteditable="true" spellcheck="false"> Suất chơi ${i}</td>
                <td class="col-status">
                    <input type="checkbox">
                </td>
             `;
            tbody.appendChild(tr);
        }
        // 1. Hàm tạo bảng và tải lại dữ liệu đã lưu (nếu có)
        function renderTable() {
            tbody.innerHTML = '';
            const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            for (let i = 1; i <= totalRows; i++) {
                // Lấy lại dữ liệu cũ hoặc dùng giá trị mặc định
                const currentText = savedData[i - 1] ? savedData[i - 1].name : `Suất chơi ${i}`;
                const isChecked = savedData[i - 1] ? savedData[i - 1].checked : false;

                const tr = document.createElement('tr');
                tr.innerHTML = `
        <td class="col-suat" contenteditable="true" spellcheck="false">${currentText}</td>
        <td class="col-status">
          <input type="checkbox" ${isChecked ? 'checked' : ''}>
        </td>
      `;
                tbody.appendChild(tr);
            }
        }
        // 2. Hàm bấm nút "LƯU DỮ LIỆU"
        function saveData() {
            const rows = tbody.querySelectorAll('tr');
            const dataToSave = [];

            rows.forEach(tr => {
                const name = tr.querySelector('.col-suat').innerText.trim();
                const checked = tr.querySelector('input[type="checkbox"]').checked;
                dataToSave.push({
                    name,
                    checked
                });
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
            alert('Đã lưu thành công!');
        }

        // 3. Hàm bấm nút "ĐẶT LẠI BAN ĐẦU" (Xóa sạch bộ nhớ lưu)
        function resetData() {
            if (confirm('Bạn có chắc chắn muốn đặt lại toàn bộ bảng về mặc định?')) {
                localStorage.removeItem('bang_suat_trung_quan');
                renderTable(); // Vẽ lại 50 suất chơi sạch từ đầu
            }
        }
        // Khởi chạy khi mở trang
        renderTable();

        // Hàm tự động quét và đánh số thứ tự các ô đã tích hoàn thành
        function updateCompletedCount() {
            const rows = tbody.querySelectorAll('tr');
            let count = 0;

            rows.forEach(tr => {
                const checkbox = tr.querySelector('input[type="checkbox"]');
                const countCell = tr.querySelector('.col-count');

                if (checkbox.checked) {
                    count++;
                    countCell.innerText = count; // Tự gán số: 1, 2, 3...
                } else {
                    countCell.innerText = ''; // Chưa tích thì để trống
                }
            });

            // Cập nhật tổng số lên tiêu đề cột nếu có span #total-count
            const totalSpan = document.getElementById('total-count');
            if (totalSpan) {
                totalSpan.innerText = count;
            }
        }

        // Cập nhật lại hàm renderTable
        function renderTable() {
            tbody.innerHTML = '';
            const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            for (let i = 1; i <= totalRows; i++) {
                const currentText = savedData[i - 1] ? savedData[i - 1].name : `Suất chơi ${i}`;
                const isChecked = savedData[i - 1] ? savedData[i - 1].checked : false;

                const tr = document.createElement('tr');
                tr.innerHTML = `
        <td class="col-suat" contenteditable="true" spellcheck="false">${currentText}</td>
        <td class="col-status">
          <input type="checkbox" onchange="updateCompletedCount()" ${isChecked ? 'checked' : ''}>
        </td>
        <td class="col-count"></td>
      `;
                tbody.appendChild(tr);
            }

            // Tính toán số lượng ngay khi tải trang
            updateCompletedCount();
        }
    </script>

</body>

<!DOCTYPE html>
<html lang="vi">

<head>

    <title>HOÀN THÀNH CÔNG VIỆC</title>
</head>

<body>
    <div class="table-container">
        <table class="custom-table">
            <thead>
                <tr>
                    <th class="col-suat">TRUNG QUÂN | THÔNG TIN SUẤT CHƠI</th>

                </tr>
            </thead>

                <!-- Các dòng này sẽ được tạo tự động từ Java Script bên dưới -->
            </tbody>
        </table>
    </div>

    <div class="action-buttons">
        <button id="btn-save" onclick="saveData()">SAVE HIGHLIGHT</button>
    </div>

    <script>
        // Tạo 50 dòng tự động
        const tbody = document.getElementById('table-body');
        const totalRows = 50;
        const STORAGE_KEY = 'bang_suat_trung_quan';

        for (let i = 1; i <= totalRows; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <!-- Thêm contenteditable="true" để click vào là gõ được -->
                <td class="col-suat" contenteditable="true" spellcheck="false"> Suất chơi ${i}</td>
                <td class="col-status">
                    <input type="checkbox">
                </td>
             `;
            tbody.appendChild(tr);
        }
        // 1. Hàm tạo bảng và tải lại dữ liệu đã lưu (nếu có)
        function renderTable() {
            tbody.innerHTML = '';
            const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            for (let i = 1; i <= totalRows; i++) {
                // Lấy lại dữ liệu cũ hoặc dùng giá trị mặc định
                const currentText = savedData[i - 1] ? savedData[i - 1].name : `Suất chơi ${i}`;
                const isChecked = savedData[i - 1] ? savedData[i - 1].checked : false;

                const tr = document.createElement('tr');
                tr.innerHTML = `
        <td class="col-suat" contenteditable="true" spellcheck="false">${currentText}</td>
        <td class="col-status">
          <input type="checkbox" ${isChecked ? 'checked' : ''}>
        </td>
      `;
                tbody.appendChild(tr);
            }
        }
        // 2. Hàm bấm nút "LƯU DỮ LIỆU"
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKB9_eDT_p-BuvrxJ5d6uCvG79OsfvjZnYxmj1CQEw/dev";

        async function saveData() {
            const rows = tbody.querySelectorAll('tr');
            const dataToSave = [];
            let currentCount = 0;

            rows.forEach(tr => {
                const name = tr.querySelector('.col-suat').innerText.trim();
                const checkbox = tr.querySelector('input[type="checkbox"]');
                const checked = checkbox ? checkbox.checked : false;

                if (checked) {
                    currentCount++;
                }

                dataToSave.push({
                    name: name,
                    checked: checked,
                    count: checked ? currentCount : ""
                });
            });

            // Đổi text nút để người dùng biết đang lưu
            const saveBtn = document.querySelector('.btn-save') || document.querySelector('button');
            const originalText = saveBtn ? saveBtn.innerText : '';
            if (saveBtn) saveBtn.innerText = "Đang lưu lên Sheet...";

            try {
                // Gửi dữ liệu thẳng lên Google Sheet
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors", // Tránh lỗi chặn CORS
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        personnel: "TRUNG QUÂN",
                        results: dataToSave
                    })
                });

                // Vẫn lưu localStorage làm bản sao dự phòng
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
                alert('Đã cập nhật dữ liệu vào cột KIỂM DUYỆT SỐ LƯỢNG trên Google Sheet!');
            } catch (error) {
                console.error("Lỗi:", error);
                alert('Lỗi khi lưu dữ liệu lên Sheet!');
            } finally {
                if (saveBtn) saveBtn.innerText = originalText;
            }
        }

        window.addEventListener('DOMContentLoaded', async() => {
            try {
                // Lấy dữ liệu mới nhất từ Google Sheet về
                const res = await fetch(SCRIPT_URL);
                const cloudData = await res.json();
                if (cloudData && cloudData.length > 0) {
                    // Cập nhật lại giao diện bảng theo dữ liệu vừa lấy trên Google Sheet về
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData));
                    renderTable(); // Gọi lại hàm vẽ bảng với dữ liệu mới
                }
            } catch (e) {
                console.log("Không tải được dữ liệu cloud, dùng tạm bộ nhớ local.");
            }
        });

        // 3. Hàm bấm nút "ĐẶT LẠI BAN ĐẦU" (Xóa sạch bộ nhớ lưu)
        function resetData() {
            if (confirm('Bạn có chắc chắn muốn đặt lại toàn bộ bảng về mặc định?')) {
                localStorage.removeItem('bang_suat_trung_quan');
                renderTable(); // Vẽ lại 50 suất chơi sạch từ đầu
            }
        }
        // Khởi chạy khi mở trang
        renderTable();

        // Hàm tự động quét và đánh số thứ tự các ô đã tích hoàn thành
        function updateCompletedCount() {
            const rows = tbody.querySelectorAll('tr');
            let count = 0;

            rows.forEach(tr => {
                const checkbox = tr.querySelector('input[type="checkbox"]');
                const countCell = tr.querySelector('.col-count');

                if (checkbox.checked) {
                    count++;
                    countCell.innerText = count; // Tự gán số: 1, 2, 3...
                } else {
                    countCell.innerText = ''; // Chưa tích thì để trống
                }
            });

            // Cập nhật tổng số lên tiêu đề cột nếu có span #total-count
            const totalSpan = document.getElementById('total-count');
            if (totalSpan) {
                totalSpan.innerText = count;
            }
        }

        // Cập nhật lại hàm renderTable
        function renderTable() {
            tbody.innerHTML = '';
            const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            for (let i = 1; i <= totalRows; i++) {
                const currentText = savedData[i - 1] ? savedData[i - 1].name : `Suất chơi ${i}`;
                const isChecked = savedData[i - 1] ? savedData[i - 1].checked : false;

                const tr = document.createElement('tr');
                tr.innerHTML = `
        <td class="col-suat" contenteditable="true" spellcheck="false">${currentText}</td>
        <td class="col-status">
          <input type="checkbox" onchange="updateCompletedCount()" ${isChecked ? 'checked' : ''}>
        </td>
        <td class="col-count"></td>
      `;
                tbody.appendChild(tr);
            }

            // Tính toán số lượng ngay khi tải trang
            updateCompletedCount();
        }
    </script>

</body>
