<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA TEAM HIGHLIGHT</title>
    <style>
        /* ================= LỚP NỀN MỜ & BẢNG FORM ĐĂNG NHẬP ================= */
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.65);
            display: none;
            /* Mặc định ẩn */
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        /* Hiển thị khi được thêm class .active */
        
        .modal-overlay.active {
            display: flex;
        }
        
        .login-box {
            position: relative;
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            padding: 36px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: popup 0.25s ease;
        }
        
        @keyframes popup {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        /* Nút đóng (X) */
        
        .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-weight: bold;
        }
        
        .close-btn:hover {
            color: #000;
        }
        
        .login-box h3 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
            color: #222;
            font-weight: 800;
        }
        
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #444;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .input-group input:focus {
            border-color: #e60000;
        }
        /* Nút xác nhận đăng nhập bên trong bảng */
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #e60000;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        
        .submit-btn:hover {
            background-color: #c40000;
        }
    </style>
</head>

<body>
    <div class="banner">
        <h2 class="sub-title">DATA TEAM HIGHLIGHT</h2>
        <h1 class="main-title">EMES ESCAPE ROOM</h1>
        <button class="btn-login" id="openLogin"><b>ĐĂNG NHẬP</b></button>
    </div>

    <!-- Bảng Popup Form Đăng Nhập -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="login-box">
            <buttion class="close-btn" id="closeLogin">&times;</buttion>
            <h3>LOGIN</h3>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tài khoản ..." required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu ..." required>
                </div>

                <!-- LƯU MẬT KHẨU -->
                <div class="remember-group">
                    <label>
                        <input type="checkbox" id="rememberMe"> Lưu thông tin đăng nhập 
                    </label>
                </div>
                <!-- KẾT THÚC ĐOẠN NÚT THÊM -->

                <button type="submit" id="submit-btn" class="submit-btn">Xác nhận</button>
            </form>
        </div>
    </div>
    <!-- Script xử lý Bật / Tắt popup -->
    <script>
        const openBtn = document.getElementById('openLogin');
        const closeBtn = document.getElementById('closeLogin');
        const modal = document.getElementById('modalOverlay');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('rememberMe');
        const submitBtn = document.getElementById('submit-btn');

        // 1. Khi vừa tải trang xong: Kiểm tra xem trước đó có tick "Lưu" không?

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('saved_username');
            const isRemembered = localStorage.getItem('remember_me') === 'true';

            if (isRemembered && savedUser) {
                usernameInput.value = savedUser;
                rememberCheckbox.checked = true;
            }
        });

        // 2. Hàm xử lý thông tin khi bấm Xác Nhận
        if (submitBtn) {
            submitBtn.addEventListener('click', () => {
                // Nếu kiểm tra đăng nhập hợp lệ:
                if (rememberCheckbox && rememberCheckbox.checked) {
                    // Lưu tên đăng nhập vào máy người dùng
                    localStorage.setItem('saved_username', usernameInput.value);
                    localStorage.setItem('saved_password', passwordInput.value);
                    localStorage.setItem('remember_me', 'true');
                } else {
                    // Nếu không tick thì xóa dữ liệu cũ đã lưu
                    localStorage.removeItem('saved_username');
                    localStorage.removeItem('saved_password');
                    localStorage.removeItem('remember_me');
                }
            });
        }

        // Bấm nút ngoài banner để hiện bảng login
        openBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        // Bấm nút (X) để đóng bảng
        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Bấm ra vùng đen bên ngoài cũng sẽ tự đóng
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // Hàm xử lý khi bấm Xác nhận đăng nhập
        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Ví dụ: tài khoản là "admin", mật khẩu là "123456" 
            //letan
            if (user === "admin" && pass === "0000") {
                alert("Đăng nhập thành công!");
                window.location.href = "./letan.html"; // Chuyển sang trang mới
            }

            //TRUNG QUÂN
            else if (user === "trungquan" && pass === "1111") {
                alert("Đăng nhập thành công!");
                window.location.href = "./trungquan.html"; // Chuyển sang trang mới
            }

            //XUÂN HIẾU
            else if (user === "xuanhieu" && pass === "2222") {
                alert("Đăng nhập thành công!");
                window.location.href = "./xuanhieu.html"; // Chuyển sang trang mới
            }

            //SONG UYÊN
            else if (user === "songuyen" && pass === "3333") {
                alert("Đăng nhập thành công!");
                window.location.href = "./songuyen.html"; // Chuyển sang trang mới
            }

            //THANH ĐẠI
            else if (user === "thanhdai" && pass === "4444") {
                alert("Đăng nhập thành công!");
                window.location.href = "./thanhdai.html"; // Chuyển sang trang mới
            }

            //ANH KIỆT
            else if (user === "anhkiet" && pass === "5555") {
                alert("Đăng nhập thành công!");
                window.location.href = "./anhkiet.html"; // Chuyển sang trang mới
            }

            //THÙY DƯƠNG
            else if (user === "thuyduong" && pass === "6666") {
                alert("Đăng nhập thành công!");
                window.location.href = "./thuyduong.html"; // Chuyển sang trang mới
            }

            //THANH GIANG
            else if (user === "thanhgiang" && pass === "7777") {
                alert("Đăng nhập thành công!");
                window.location.href = "./thanhgiang.html"; // Chuyển sang trang mới
            }

            //MINH CHÂU
            else if (user === "minhchau" && pass === "8888") {
                alert("Đăng nhập thành công!");
                window.location.href = "./minhchau.html"; // Chuyển sang trang mới
            }

            //NHẤT QUÂN
            else if (user === "nhatquan" && pass === "9999") {
                alert("Đăng nhập thành công!");
                window.location.href = "./nhatquan.html"; // Chuyển sang trang mới
            }

            //QUỲNH NHƯ
            else if (user === "quynhnhu" && pass === "1010") {
                alert("Đăng nhập thành công!");
                window.location.href = "./quynhnhu.html"; // Chuyển sang trang mới
            }

            //THANHLIEM (KIỂM DUYỆT)
            else if (user === "thanhliem" && pass === "6026") {
                alert("Đăng nhập thành công!");
                window.location.href = "./thanhliem.html"; // Chuyển sang trang mới
            }

            // SAI TÀI KHOẢN HOẶC MẬT KHẨU
            else {
                alert("Sai tên đăng nhập hoặc mật khẩu!");
            }
        }
    </script>
</body>

</html>
